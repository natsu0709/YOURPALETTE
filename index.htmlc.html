<style>
:root{--bg:#f8f6f2;--ink:#3a3532;--sub:#9a918a;--faint:#cfc7bf;--glass:rgba(255,255,255,.52);--en:"Cormorant Garamond",Georgia,serif;--jp:"Shippori Mincho","Hiragino Mincho ProN",serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--jp);min-height:100%;overflow-x:hidden}
body{display:flex;justify-content:center}
.wash{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(80px);opacity:.38;transition:background 2.4s ease;animation:drift 26s ease-in-out infinite alternate}
.blob:nth-child(1){left:-30vmax;top:-30vmax}
.blob:nth-child(2){right:-32vmax;top:10vh;animation-duration:31s;animation-delay:-8s}
.blob:nth-child(3){left:-20vmax;bottom:-36vmax;animation-duration:29s;animation-delay:-14s}
.blob:nth-child(4){right:-28vmax;bottom:-30vmax;animation-duration:35s;animation-delay:-4s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.12)}}
#motes{position:fixed;inset:0;pointer-events:none;z-index:1}
#app{position:relative;z-index:2;width:100%;max-width:440px;padding:30px 22px 60px;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.screen{animation:mist 1s ease both}
.screen.out{animation:mistout .55s ease both}
@keyframes mist{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes mistout{to{opacity:0;transform:translateY(-8px)}}
.en{font-family:var(--en);font-style:italic;font-weight:300}
.btn{display:block;width:100%;padding:17px;border-radius:999px;background:rgba(58,53,50,.88);color:#fbf9f6;font-size:15px;letter-spacing:.25em;transition:transform .3s,opacity .3s;box-shadow:0 14px 30px -14px rgba(58,53,50,.6)}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--glass);color:var(--ink);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 30px -18px rgba(58,53,50,.4);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
a.btn{text-decoration:none;text-align:center}
/* start */
.hero{text-align:center;padding-top:40px}
.hero .pre{font-size:15px;letter-spacing:.3em;color:var(--sub)}
.hero h1{font-family:var(--en);font-weight:300;line-height:.9;margin:18px 0 14px}
.hero h1 .a{display:block;font-style:italic;font-size:46px;letter-spacing:.04em}
.hero h1 .b{display:block;font-size:58px;letter-spacing:.2em;padding-left:.2em}
.hero .jp{font-size:12px;letter-spacing:.5em;color:var(--sub)}
.float{position:relative;height:120px;margin:34px 0 26px}
.float span{position:absolute;border-radius:50%;animation:float 7s ease-in-out infinite;opacity:.9}
@keyframes float{50%{transform:translateY(-12px)}}
.lead{font-size:14.5px;line-height:2.3;letter-spacing:.12em;text-align:center;margin-bottom:38px}
.howto{font-size:12.5px;line-height:2.1;letter-spacing:.08em;color:var(--sub);text-align:center;margin-bottom:34px}
/* pick */
.top{display:flex;justify-content:space-between;align-items:center;min-height:24px;margin-bottom:14px}
.undo{font-size:12px;letter-spacing:.15em;color:var(--sub);transition:opacity .4s}
.undo:disabled{opacity:0;pointer-events:none}
.count{font-family:var(--en);font-size:16px;letter-spacing:.15em;color:var(--sub)}
.prog{display:flex;gap:4px;margin-bottom:38px}
.prog i{flex:1;height:2px;border-radius:2px;background:rgba(0,0,0,.08);transition:background 1.2s}
.q{text-align:center;margin-bottom:30px;min-height:120px}
.q .fam{font-family:var(--en);font-style:italic;font-weight:300;font-size:50px;line-height:1;letter-spacing:.06em;transition:color 1s}
.q .jpn{font-size:12px;letter-spacing:.4em;color:var(--sub);margin-top:10px}
.q h2{font-size:17px;font-weight:500;letter-spacing:.18em;margin-top:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:20px;border-radius:30px;background:rgba(251,250,248,.94);box-shadow:0 20px 50px -34px rgba(60,45,30,.35)}
.drop{aspect-ratio:1;position:relative;opacity:0;animation:appear .8s cubic-bezier(.2,.7,.2,1) forwards;will-change:opacity,transform}
.drop b{position:absolute;inset:0;border-radius:var(--r);background:var(--c);box-shadow:0 6px 14px -10px rgba(40,30,20,.45);transition:transform .6s cubic-bezier(.2,.7,.2,1),opacity .6s}
.drop:active b{transform:scale(.93)}
.drop.chosen b{transform:scale(1.14)}
.drop.fade b{opacity:0;transform:scale(.8)}
@keyframes appear{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
.hint{text-align:center;color:var(--sub);font-size:12px;letter-spacing:.12em;margin-top:30px;line-height:2}
.fav{grid-template-columns:repeat(4,1fr);gap:14px}
.bleed{position:fixed;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;pointer-events:none;z-index:1;animation:bleed 1.6s ease-out forwards}
@keyframes bleed{from{transform:scale(1);opacity:.55}to{transform:scale(28);opacity:0}}
/* analyzing */
.ana{text-align:center;padding-top:22vh}
.orbit{position:relative;width:180px;height:180px;margin:0 auto 46px;animation:spin 6s linear infinite}
.orbit span{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;border-radius:50%;animation:gather 2.6s cubic-bezier(.6,0,.3,1) forwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes gather{0%{opacity:0}20%{opacity:1}80%{transform:rotate(var(--a)) translateX(78px)}100%{transform:rotate(var(--a)) translateX(0) scale(2.4);opacity:.25;filter:blur(6px)}}
.ana p{font-size:13px;letter-spacing:.35em;color:var(--sub)}
/* result */
.r-top{text-align:center;padding-top:6px}
.r-top .en{font-size:17px;letter-spacing:.3em;color:var(--sub)}
.pal{display:block;width:100%;max-width:360px;margin:6px auto 0}
.pal .d{opacity:0;animation:dropin 1.2s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes dropin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.code{text-align:center;font-family:var(--en);letter-spacing:.5em;font-size:14px;color:var(--sub);margin-top:4px}
.tname{text-align:center;font-size:27px;font-weight:600;letter-spacing:.1em;line-height:1.5;margin:10px 0 12px;white-space:nowrap;overflow:hidden}
.tname span{display:inline-block;opacity:0;animation:letter 1.1s ease forwards}
@keyframes letter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.catch{text-align:center;font-size:14px;letter-spacing:.1em;color:var(--sub);line-height:2;margin-bottom:28px;white-space:nowrap;overflow:hidden}
.kw{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:30px}
.kw span{font-size:12px;letter-spacing:.15em;padding:6px 14px;border-radius:999px;background:var(--glass);border:1px solid rgba(255,255,255,.9)}
.card{background:var(--glass);border:1px solid rgba(255,255,255,.85);border-radius:26px;padding:24px 22px;margin-bottom:16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 20px 40px -30px rgba(70,55,40,.35);opacity:0;transform:translateY(18px);transition:opacity 1.1s ease,transform 1.1s ease}
.card.in{opacity:1;transform:none}
.card h3{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;font-weight:500;font-size:13px;letter-spacing:.2em;color:var(--sub)}
.card h3 .en{font-size:20px;letter-spacing:.06em;color:var(--ink)}
.card p{font-size:14.5px;line-height:2.1;letter-spacing:.05em}
.card p+p{margin-top:12px}
.sub{font-size:13px;letter-spacing:.15em;margin:18px 0 6px;font-weight:600}
.sub:first-of-type{margin-top:0}
.bar{margin-bottom:20px}.bar:last-child{margin-bottom:0}
.bar .lr{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.12em;color:var(--sub);margin-bottom:9px}
.bar .lr .on{color:var(--ink);font-weight:600}
.bar .track{height:4px;border-radius:9px;position:relative}
.bar .knob{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.15);transform:translate(-50%,-50%);left:50%;transition:left 2s cubic-bezier(.2,.8,.2,1)}
.big{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.big i{width:58px;height:58px;border-radius:50%;flex:none;box-shadow:0 10px 24px -10px var(--c);background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.5),rgba(255,255,255,0) 45%),var(--c)}
.big .t{font-size:18px;font-weight:600;letter-spacing:.12em}
.big .s{font-size:12px;color:var(--sub);letter-spacing:.1em;margin-top:2px;font-family:var(--en)}
.tones{display:grid;gap:7px;margin:4px 0 16px}
.tones div{display:grid;grid-template-columns:118px 1fr 22px;align-items:center;gap:8px;font-size:12px;letter-spacing:.06em;color:var(--sub)}
.tones div.on{color:var(--ink);font-weight:600}
.tones u{display:block;height:6px;border-radius:6px;background:rgba(0,0,0,.06);overflow:hidden;text-decoration:none}
.tones u s{display:block;height:100%;border-radius:6px;background:var(--ink);opacity:.55;text-decoration:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stats div{padding:14px;border-radius:18px;background:rgba(255,255,255,.5);text-align:center}
.stats b{display:block;font-family:var(--en);font-weight:400;font-size:30px;line-height:1.1}
.stats span{font-size:11px;letter-spacing:.12em;color:var(--sub)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:12px 16px;font-size:14px;line-height:1.9}
.kv dt{color:var(--sub);font-size:12px;letter-spacing:.12em;padding-top:3px}
.clist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:rgba(255,255,255,.55);text-align:left}
.chip i{width:28px;height:28px;border-radius:50%;flex:none}
.chip span{font-size:11.5px;line-height:1.45;letter-spacing:.04em}
.chip code{display:block;font-size:10.5px;color:var(--sub);font-family:var(--en);letter-spacing:.08em}
.actions{display:grid;gap:12px;margin-top:28px}
.note{text-align:center;font-size:11px;letter-spacing:.1em;color:var(--sub);margin-top:30px;line-height:2}
/* modal */
.modal{position:fixed;inset:0;z-index:10;background:rgba(248,246,242,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;animation:mist .6s ease both}
.modal img{max-width:100%;max-height:64vh;border-radius:18px;box-shadow:0 30px 60px -30px rgba(60,45,30,.5)}
.modal .row{display:grid;gap:10px;width:100%;max-width:360px;margin-top:20px}
.modal p{font-size:11.5px;letter-spacing:.1em;color:var(--sub);margin-top:12px;text-align:center;line-height:1.9}
.share{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:360px}
.share a,.share button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border-radius:20px;background:rgba(255,255,255,.7);text-decoration:none;color:var(--ink);font-size:12px;letter-spacing:.08em}
.share i{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-weight:700;font-size:15px;font-family:system-ui,sans-serif}
.modal h4{font-weight:500;font-size:15px;letter-spacing:.25em;margin-bottom:18px}
#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);background:rgba(58,53,50,.85);color:#fbf9f6;padding:10px 20px;border-radius:999px;font-size:12px;letter-spacing:.12em;opacity:0;transition:all .5s;pointer-events:none;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>

const TYPES={
BVWU:{n:'ひだまりのレモネード',c:'いるだけで周りの体温を上げる、天然のひだまり',o:'明るく鮮やかで、あたたかい色を迷いなく揃えたあなた。好きなものがはっきりしていて気分の波が少なく、いつも同じ温度で人に接することができます。その安定した明るさが、まわりに安心感を与えています。',k:['朗らか','まっすぐ','面倒見がいい'],love:'好きになったら素直に伝えるタイプ。駆け引きは苦手ですが、裏表のない愛情表現が相手の心をほどきます。一緒に笑える時間を何より大切にします。',ppl:'誰とでも分け隔てなく話せる人気者。グループの中心にいることが多く、落ち込んでいる人にいち早く気づいて声をかけられます。',work:'明るい雰囲気でチームを引っ張るムードメーカー。目標がはっきりしているほど力を発揮します。接客や企画、人前に立つ役割に向いています。',s:'ムードづくり／決断の早さ／裏表のなさ',w:'楽しいノリで押し切って、静かな人の本音を聞き逃しがち。ときどき聞き役に回ると、もっと深い信頼が生まれます。'},
BVWF:{n:'お祭りの屋台通り',c:'やりたいことが多すぎて、毎日が縁日',o:'明るく鮮やかで温かい色を、ひらめきのままに次々と選んだあなた。好奇心のアンテナが広く、新しいものを見つけると心が跳ねる人です。気まぐれさも含めて、人生を全力で楽しむ才能の持ち主。',k:['好奇心旺盛','行動派','お祭り好き'],love:'恋はいつも突然始まるタイプ。刺激的なデートやサプライズが好きで、一緒にいて飽きない相手に惹かれます。小さな約束を守ると、気持ちの本気度がしっかり伝わります。',ppl:'友達が多く、いろんなコミュニティに顔を出す社交家。初対面でもすぐに打ち解けられ、人と人をつなぐハブになっています。',work:'アイデアの数と行動の速さが武器。ゼロから何かを始める場面で輝きます。ルーティンより、変化のあるプロジェクト型の働き方が合います。',s:'行動力／アイデアの数／場を盛り上げる力',w:'始めたことが散らかりやすい。ゴールをひとつ決めて走ると、あなたは無敵になります。'},
BVCU:{n:'夏空のソーダ',c:'さわやかで、芯はまっすぐ',o:'明るく鮮やかなクール寄りの色を、ぶれずに選び続けたあなた。軽やかで話しやすい雰囲気の奥に、しっかりとした自分の基準を持っています。ちょうどいい距離感で人と付き合える、信頼されやすい人です。',k:['爽やか','合理的','自立している'],love:'ベタベタしすぎない、心地よい距離感の恋を好みます。お互いの時間を尊重できる相手と長続きしやすいタイプ。好意はさりげなく、でも誠実に伝えます。',ppl:'誰とでも感じよく接しつつ、深く付き合う相手はきちんと選ぶタイプ。頼まれごとを涼しい顔でこなすので、気づけば頼られ役に。',work:'状況を冷静に判断し、さっと最適解を出せる人。段取りや改善が得意で、チームの風通しをよくします。企画、デザイン、ITなど頭を使う仕事に向いています。',s:'爽やかさ／筋の通った判断／切り替えの早さ',w:'クールに見えて、実は人に頼るのが苦手。弱音をひとつこぼすだけで、関係はもっと近くなります。'},
BVCF:{n:'プリズムのしゃぼん玉',c:'見るたびに違う色に光る、つかみどころのない人',o:'鮮やかで涼しげな色を、気分のままに軽やかに選んだあなた。ひとつの型にはまらない発想力があり、周りからは「おもしろい人」と思われています。自由でいられる場所で、いちばん輝くタイプです。',k:['自由人','ユニーク','感性が鋭い'],love:'束縛はちょっと苦手。お互いの「好き」を尊重し合える、友達のような恋人関係が理想です。ふと見せる意外な一面が、相手をますます惹きつけます。',ppl:'独特の視点で会話を盛り上げる人。気の合う仲間とは深く、そうでない人とはふんわりと、自然体の付き合い方ができます。',work:'型破りなアイデアで周りを驚かせるクリエイター気質。自由度の高い環境や、新しい表現を求められる仕事でぐんと伸びます。',s:'発想力／柔軟さ／独自のセンス',w:'気分屋に見られることも。大事な約束だけは、色を変えずに守って。'},
BMWU:{n:'午後のミルクティー',c:'やさしさを、ちょうどいい温度で出せる人',o:'明るくやわらかい、あたたかみのある色で揃ったパレット。主張しすぎず、でも冷たくもない、ほっとする空気をまとっています。人の気持ちの小さな変化に気づける、繊細なやさしさの持ち主です。',k:['穏やか','聞き上手','気配り屋'],love:'相手を包み込むような、穏やかで安定した恋をするタイプ。記念日や小さな気遣いを大切にし、長く寄り添える関係を育てます。',ppl:'気づけばみんなの相談役。否定せずに話を聞けるので、あなたの前では誰もが素直になれます。',work:'チームの潤滑油。丁寧さとサポート力で、周りが働きやすい空気をつくります。教育、接客、サポート職などで信頼を集めます。',s:'聞き上手／安心感／丁寧さ',w:'人に合わせすぎて、自分の好みを後回しにしがち。「わたしはこれが好き」を言葉にしてみて。'},
BMWF:{n:'古着屋のドライフラワー',c:'かわいいの定義は、自分で決める',o:'明るくくすんだ温かい色を、いろんなトーンで集めたあなた。流行より「自分がいいと思うか」を大事にする、こだわりの人です。少しレトロで味のあるものに惹かれ、組み合わせのセンスが光ります。',k:['こだわり派','ノスタルジック','審美眼'],love:'時間をかけて育つ恋が好き。趣味や価値観が合う相手に惹かれ、古い映画やカフェを一緒に楽しむような関係が理想です。',ppl:'少人数の、感性が合う仲間と深く付き合うタイプ。あなたのおすすめは外れないと、密かに信頼されています。',work:'「好き」を仕事にできると強い人。デザイン、雑貨、編集、ものづくりなど、センスと手間を惜しまない仕事に向いています。',s:'独自の美意識／組み合わせ力／ものを大切にする心',w:'こだわりが伝わらないと抱え込みがち。理由を言葉にすると、味方が増えます。'},
BMCU:{n:'朝霧のガラス瓶',c:'静かで澄んでいて、近くで見るほど美しい',o:'明るくくすみのある涼しい色を、ていねいに揃えたあなた。落ち着いていて、細かな違いに気づける繊細な感性の持ち主です。派手さはなくても、一緒にいると心が整う人だと思われています。',k:['繊細','上品','思慮深い'],love:'慎重にゆっくり心を開くタイプ。言葉より行動で誠実さを示す相手に惹かれます。一度信じた人には、静かで深い愛情を注ぎます。',ppl:'大勢より、信頼できる数人と穏やかに過ごすのが好き。距離感を大切にするので、一緒にいて疲れない人と言われます。',work:'正確さと観察力が光る職人肌。資料づくり、研究、デザイン、編集など、丁寧さが評価される仕事で頼られます。',s:'観察力／落ち着き／品のよさ',w:'慎重すぎてチャンスを見送ることも。7割の自信があれば、踏み出して大丈夫。'},
BMCF:{n:'夢見るパステル雲',c:'ふわふわしているようで、頭の中は大冒険',o:'淡くやさしい涼しげな色を、気の向くまま選んだあなた。空想が好きで、ひとりの時間にアイデアを育てるタイプです。マイペースな雰囲気が、周りの肩の力をそっと抜いてくれます。',k:['夢見がち','マイペース','想像力豊か'],love:'ロマンチックな恋に憧れる人。言葉や手紙、ささやかなサプライズにときめきます。現実的な相手と組むと、ちょうどいいバランスに。',ppl:'誰かを否定することが少なく、ふんわりと人を受け入れられる人。不思議と年齢や立場の違う友達が多いタイプです。',work:'想像力を活かせる仕事で本領発揮。物語、イラスト、企画など「まだないもの」を形にする場面で輝きます。',s:'想像力／包容力／感受性',w:'締め切りと現実がちょっと苦手。夢を小さな予定に分けると、ぐっと叶いやすくなります。'},
DVWU:{n:'真紅のビロード',c:'情熱を、品よく燃やせる人',o:'深く鮮やかな温かい色を、迷いなく選び抜いたあなた。目標が決まるとまっすぐ突き進む、内に強い熱を持つ人です。存在感があり、ここぞという場面で自然と頼られます。',k:['情熱的','責任感','カリスマ'],love:'一途で愛情深いタイプ。好きな人のためなら労力を惜しみません。誠実で芯のある相手と、深く強い絆を結びます。',ppl:'面倒見がよく、仲間を守るリーダー気質。言うべきことはきちんと言うので、信頼と少しの畏敬を集めています。',work:'責任ある立場で燃えるタイプ。目標達成への集中力が高く、リーダーや専門職、勝負のかかる仕事で結果を出します。',s:'集中力／責任感／存在感',w:'こだわりの強さが頑固に見えることも。ときどき肩の力を抜いて、人に任せてみて。'},
DVWF:{n:'夕焼けのカーニバル',c:'ドラマチックに生きたい、主人公気質',o:'深く鮮やかで温かい色を、いろんな表情で集めたあなた。感情表現が豊かで、喜びも悔しさも全力で味わえる人です。あなたがいると、いつも物語が動き出します。',k:['表現力','情熱家','エンターテイナー'],love:'恋には全力投球。気持ちの盛り上がりを大切にし、ドラマのような展開に憧れます。感情をまっすぐ受け止めてくれる相手と相性◎。',ppl:'感情豊かで人を惹きつける人。喜怒哀楽を素直に出すので、周りもつられて本音を話せます。',work:'人の心を動かす仕事が天職。表現、営業、イベント、エンタメなど、熱量がそのまま成果になる場所で輝きます。',s:'表現力／熱量／巻き込む力',w:'気持ちの浮き沈みが激しめ。大事な決断は、ひと晩寝てからでも遅くありません。'},
DVCU:{n:'深海のサファイア',c:'冷静さの奥に、揺るがない意志',o:'深く鮮やかなクール寄りの色で、きりっと揃ったパレット。感情に流されず、自分の信じる道を静かに進める人です。口数は多くなくても、言葉にはしっかりと重みがあります。',k:['冷静','意志が強い','誠実'],love:'簡単には心を開かないぶん、選んだ相手には誠実そのもの。言葉より態度で愛情を示し、信頼で結ばれた関係を築きます。',ppl:'狭く深く、本当に信頼できる人と付き合うタイプ。いざというとき頼れる人として、周りから一目置かれています。',work:'論理的な判断力とぶれない軸を持つ戦略家。分析、技術職、管理職など、冷静さが求められる場面で真価を発揮します。',s:'判断力／ぶれない軸／誠実さ',w:'近寄りがたく見られがち。笑顔ひとつで、印象はがらりと変わります。'},

DMWU:{n:'アンティークの書斎',c:'時間をかけて味が出る、本物志向',o:'深く落ち着いた温かい色で揃ったパレット。流行に左右されず、長く愛せるものを選ぶ審美眼があります。じっくり信頼を積み上げ、「あの人に任せれば安心」と言われる人です。',k:['堅実','本物志向','包容力'],love:'燃え上がるより、じっくり温める恋。安心感を大切にし、家族のような穏やかな関係を長く育てていけます。',ppl:'古くからの友人を大切にするタイプ。落ち着いた物腰で、年上からも年下からも頼りにされます。',work:'コツコツ続ける力と確かな判断で信頼を得る人。専門職、職人、経理、教育など、経験が積み重なる仕事で花開きます。',s:'継続力／信頼感／審美眼',w:'変化に少し腰が重め。たまには知らない店に入って、新しい色を拾ってみて。'},
DMWF:{n:'秋の森の寄り道',c:'まっすぐより、まわり道が好き',o:'深くくすんだ温かい色を、気ままに拾い集めたあなた。効率よりも過程を楽しめる、味わい深い人です。寄り道で見つけたものが、いつかあなただけの武器になります。',k:['味わい深い','好奇心','おおらか'],love:'自然体でいられる恋が理想。一緒に散歩したり、のんびり過ごせる相手と心が通います。気取らない優しさが魅力です。',ppl:'おおらかで、どんな人も受け入れる懐の深さがあります。あなたといると、みんな肩の力が抜けるようです。',work:'経験の幅広さが強み。一見遠回りに見えた経験同士がつながって、独自の価値を生み出します。',s:'好奇心／包容力／ユーモア',w:'のんびりしすぎて出遅れることも。大事な日だけは、アラームを二つかけて。'},
DMCU:{n:'雨上がりの石畳',c:'静けさの中に、確かな強さ',o:'深くくすみのある涼しい色を、きっちり揃えたあなた。物事を冷静に見つめ、地に足のついた判断ができる人です。目立たないところで周りを支える、縁の下の名プレイヤー。',k:['冷静','堅実','縁の下の力持ち'],love:'派手なアプローチより、日々の小さな積み重ねで愛を育てるタイプ。安心して背中を預けられる相手を選びます。',ppl:'感情に振り回されず、いつも同じ態度で接してくれる人。だからこそ、困ったときに真っ先に思い出される存在です。',work:'着実さと正確さで信頼を勝ち取る人。管理、エンジニア、事務、研究など、ミスの許されない場面で頼られます。',s:'冷静さ／堅実さ／支える力',w:'がまんを溜め込みがち。しんどいときは、しんどいと言っていい。'},
DMCF:{n:'月夜の水彩画',c:'にじむ境界線に、美しさを見つける人',o:'深く落ち着いた涼しい色を、にじむように自由に選んだあなた。白黒つけないあいまいさを楽しめる、感受性の豊かな人です。言葉にならない気持ちを、作品や行動で表現できます。',k:['感受性','芸術肌','やさしい'],love:'心の奥まで分かり合える恋を求めます。言葉にしなくても通じ合う瞬間に、何よりの幸せを感じるタイプです。',ppl:'人の痛みに敏感で、そっと寄り添える人。大勢の中では静かでも、一対一になると深い話ができます。',work:'感性を形にする仕事で輝きます。音楽、文章、映像、デザインなど、心の機微を表現する場で唯一無二の存在に。',s:'感受性／芸術センス／やさしさ',w:'気持ちが内にこもりがち。信頼できる人に、少しずつ見せてみて。'}

function hex(c){const s=c.s/100,l=c.l/100,k=n=>(n+c.h/30)%12,a=s*Math.min(l,1-l);
 const f=n=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1))));
 return '#'+[f(0),f(8),f(4)].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()}
function rgba(c,a){const h=hex(c);return `rgba(${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)},${a})`}
const monoC=(l,t)=>({h:t>=0?36:215,s:Math.abs(t)*14,l,t,mono:1});
function toneOf(c){const{s,l}=c;
 if(l>=75)return s>=62?'ライト':'ペール';
 if(l>=56)return s>=80?'ブライト':s>=48?'ソフト':'ライトグレイッシュ';
 if(l>=40)return s>=70?'ビビッド':s>=42?'ダル':'グレイッシュ';
 return s>=58?'ディープ':s>=36?'ダーク':'ダークグレイッシュ'}

 const sc=Math.abs(hdiff(c.h,f.h))/28+Math.abs(c.l-f.L[1])/22+Math.abs(c.s-f.S[1])/45;if(sc<bs){bs=sc;best=i}});return best}
const rr=()=>{const v=()=>40+Math.random()*20|0;return `${v()}% ${100-v()+40}% ${v()}% ${v()}% / ${v()}% ${v()}% ${v()}% ${v()}%`};

let S,hist,t0=0;
function reset(){S={i:0,stage:0,opts:gen0(0),picks:[],times:[],kept:0,main:null};hist=[]}
function gen0(i){const f=FAM[i];const o=[];
 if(f.mono){for(const l of f.L)for(const t of[1,0,-1])o.push(monoC(l,t));return shuffle(o)}
 const dh=shuffle([-6,-6,-6,0,0,0,6,6,6]);let k=0;
 for(const l of f.L)for(const s of f.S)o.push({h:mod(f.h+dh[k++]),s,l});return shuffle(o)}
function gen1(c,i){const f=FAM[i];const o=[];
 if(f.mono){for(const dl of[6,0,-6])for(const dt of[.5,0,-.5]){const x=monoC(clamp(c.l+dl,18,96),clamp(c.t+dt,-1.5,1.5));x.center=!dl&&!dt;o.push(x)}return shuffle(o)}
 const dh=shuffle([-5,-5,-5,-5,5,5,5,5]);let k=0;
 for(const dl of[6,0,-6])for(const ds of[10,0,-10]){const d=(!dl&&!ds)?0:dh[k++];
  o.push({h:mod(c.h+d),s:clamp(c.s+ds,10,100),l:clamp(c.l+dl,14,92),center:!dl&&!ds&&!d})}
 return shuffle(o)}

/* =========================================================
   ANALYSIS
   ========================================================= */
function analyze(){
 const ps=S.picks,ln=[],sn=[],wn=[];
 ps.forEach(p=>{const f=FAM[p.f];
  if(f.mono){ln.push((p.l-f.L[1])/25);wn.push(clamp(p.t,-1.5,1.5));return}
  ln.push((p.l-f.L[1])/((f.L[0]-f.L[2])/2));
  sn.push((p.s-f.S[1])/((f.S[0]-f.S[2])/2));
  const dir=-Math.sin(rad(f.h-35))>=0?1:-1;wn.push(dir*hdiff(p.h,f.h)/8)});
 const m=ps[S.main];
 const L=mean(ln),Sa=mean(sn),W=mean(wn)+FAM[m.f].warm*.22,U=Math.sqrt(vr(ln)+vr(sn));
 const code=(L>=0?'B':'D')+(Sa>=0?'V':'M')+(W>=0?'W':'C')+(U<UTH?'U':'F');
 const tc={};ps.forEach(p=>{if(!p.mono){const t=toneOf(p);tc[t]=(tc[t]||0)+1}});
 const tones=Object.entries(tc).sort((a,b)=>b[1]-a[1]);
 const season=W>=0?(L+Sa*.3>=0?'spring':'autumn'):(Sa-L*.3>=0?'winter':'summer');
 const speed=mean(S.times),kept=Math.round(S.kept/12*100);
 let comp;
 if(m.mono)comp={h:m.t>=0?215:36,s:65,l:55};
 else comp={h:mod(m.h+180),s:clamp(m.s,35,85),l:clamp(m.l,38,74)};
 const cf=nearestFam(comp);
 return{L,Sa,W,U,code,tones,season,speed,kept,comp,compName:TONES[toneOf(comp)][0]+FAM[cf].n};
}
const UTH=1.02;
const pct=v=>clamp(Math.round(50+v*40),3,97);

  <p class="sub">${sp[0]}</p><p>${sp[1]}</p><p>${kp}</p></div>

 <div class="card"><h3><span class="en">Life</span>あなたの日々</h3>
  <p class="sub">恋愛</p><p>${T.love}</p><p class="sub">人間関係</p><p>${T.ppl}</p><p class="sub">仕事・学び</p><p>${T.work}</p></div>

 <div class="card"><h3><span class="en">Notes</span>強みと、気をつけたいこと</h3>

 <div class="card"><h3><span class="en">Missing</span>あなたに足りない色</h3>

 <div class="card"><h3><span class="en">Colors</span>パレットの十二色</h3>
  <div class="clist">${ps.map(c=>`<button class="chip" data-hex="${hex(c)}"><i style="background:${hex(c)}"></i><span>${cname(c)}<code>${hex(c)}</code></span></button>`).join('')}</div>
  <p style="font-size:11px;color:var(--sub);margin-top:12px;text-align:center">タップでカラーコードをコピー</p></div>

 <div class="actions">
  <button class="btn" id="img">結果を画像で保存</button>

  <button class="btn soft" id="sns">SNSで共有する</button>
  <button class="btn soft" id="again">もう一度、パレットをつくる</button>
 </div>
 <p class="note">この診断は、色彩心理をヒントにしたエンタメです。<br>同じ人でも、その日の心で少しずつ色は変わります。</p></div>`,()=>{
  window.scrollTo(0,0);
  const doFit=()=>{fit($('.tname'),27,12);fit($('.catch'),14,9)};doFit();try{document.fonts.ready.then(doFit)}catch(e){}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');
   e.target.querySelectorAll('.knob').forEach(k=>setTimeout(()=>k.style.left=k.dataset.x+'%',300));io.unobserve(e.target)}}),{threshold:.15});
  app.querySelectorAll('.card').forEach(c=>io.observe(c));
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>copy(b.dataset.hex,b.dataset.hex+' をコピーしました'));
  const txt=`【YOUR PALETTE】\n私のパレットは「${T.n}」\n${T.c}\nいちばん好きな色：${cname(m)}\n${SE[1]}／${top}トーン\n#YOURPALETTE`;
  $('#cp').onclick=()=>copy(txt+'\n'+ps.map(hex).join(' '),'結果をコピーしました');
  $('#sns').onclick=()=>shareSNS(txt);
  $('#img').onclick=saveImage;
  $('#again').onclick=()=>{reset();pick()};
 });
}

function fit(el,max,min){if(!el)return;let v=max;el.style.fontSize=v+'px';while(el.scrollWidth>el.clientWidth+1&&v>min){v-=.5;el.style.fontSize=v+'px'}}
function wrap(ctx,text,x,y,maxW,lh){let line='',lines=[];for(const ch of text){if(ctx.measureText(line+ch).width>maxW){lines.push(line);line=ch}else line+=ch}lines.push(line);lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));return lines.length}
function drop(ctx,x,y,r,col,c){
 let g=ctx.createRadialGradient(x,y,r*.6,x,y,r*1.9);g.addColorStop(0,rgba(c,.28));g.addColorStop(1,rgba(c,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*1.9,0,7);ctx.fill();
 ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
 g=ctx.createRadialGradient(x-r*.35,y-r*.4,0,x-r*.35,y-r*.4,r*.8);g.addColorStop(0,'rgba(255,255,255,.45)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
const INK='#3a3532',SUBC='#9a918a',BODY='#4a4440',JP='"Shippori Mincho",serif',EN='"Cormorant Garamond",serif';
function lines(ctx,text,w){const out=[];let line='';for(const ch of text){if(line&&ctx.measureText(line+ch).width>w&&!'、。」）'.includes(ch)){out.push(line);line=ch}else line+=ch}if(line)out.push(line);return out}
function fitFont(ctx,t,maxW,size,min,weight,fam){let v=size;while(v>min){ctx.font=`${weight} ${v}px ${fam}`;if(ctx.measureText(t).width<=maxW)break;v-=1}ctx.font=`${weight} ${v}px ${fam}`;return v}
function runCol(ctx,B,x,w,y0,s,draw){let y=y0;ctx.textAlign='left';
 B.forEach((b,i)=>{
  if(b.t==='h'){if(i)y+=40*s;y+=40*s;if(draw){ctx.fillStyle=INK;ctx.font=`italic 300 ${42*s}px ${EN}`;ctx.fillText(b.en,x,y);const ew=ctx.measureText(b.en).width;ctx.fillStyle=SUBC;ctx.font=`400 ${23*s}px ${JP}`;ctx.fillText(b.jp,x+ew+16*s,y)}y+=20*s}
  else if(b.t==='sub'){y+=34*s;if(draw){ctx.fillStyle=INK;ctx.font=`600 ${25*s}px ${JP}`;ctx.fillText(b.x,x,y)}y+=6*s}
  else if(b.t==='p'){ctx.font=`400 ${24*s}px ${JP}`;lines(ctx,b.x,w).forEach((l,k)=>{y+=(k?41:36)*s;if(draw){ctx.fillStyle=BODY;ctx.fillText(l,x,y)}});y+=6*s}
  else if(b.t==='sw'){const r=30*s;y+=14*s;if(draw){drop(ctx,x+r,y+r,r,hex(b.c),b.c);ctx.fillStyle=INK;fitFont(ctx,b.a,w-2*r-20*s,28*s,14,600,JP);ctx.fillText(b.a,x+2*r+20*s,y+r-4*s);ctx.fillStyle=SUBC;fitFont(ctx,b.b,w-2*r-20*s,21*s,11,400,JP);ctx.fillText(b.b,x+2*r+20*s,y+r+28*s)}y+=2*r}
  else if(b.t==='chips'){const cw=w/2,rh=58*s;y+=14*s;b.x.forEach((c,k)=>{const x0=x+(k%2)*cw,cy=y+Math.floor(k/2)*rh+rh/2;if(draw){ctx.fillStyle=hex(c);ctx.beginPath();ctx.arc(x0+17*s,cy,16*s,0,7);ctx.fill();ctx.fillStyle=BODY;fitFont(ctx,cname(c),cw-52*s,21*s,10,400,JP);ctx.fillText(cname(c),x0+44*s,cy-1*s);ctx.fillStyle=SUBC;ctx.font=`400 ${19*s}px ${EN}`;ctx.fillText(hex(c),x0+44*s,cy+21*s)}});y+=Math.ceil(b.x.length/2)*rh}
 });return y-y0}
function layoutCol(ctx,B,x,w,y0,y1){let s=1.45;while(s>.55&&runCol(ctx,B,x,w,y0,s,false)>y1-y0)s-=.02;runCol(ctx,B,x,w,y0,s,true)}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
async function render(){
 const W=3040,H=1600,cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
 try{await Promise.all(['600 60px "Shippori Mincho"','400 30px "Shippori Mincho"','italic 300 60px "Cormorant Garamond"','400 40px "Cormorant Garamond"'].map(f=>document.fonts.load(f)))}catch(e){}
 const{A,T,m,opp,sp,kp,top,SE,uP}=R,ps=S.picks;
 let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#fbf9f6');g.addColorStop(1,'#f2eee8');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 [[200,200,800],[1500,1500,900],[2900,250,800],[600,1500,700],[2300,900,700]].forEach(([x,y,r],i)=>{const c=i===0?m:ps[(i*5+S.main)%12];g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(c,.22));g.addColorStop(1,rgba(c,0));ctx.fillStyle=g;ctx.fillRect(0,0,W,H)});
 /* column 1 */
 const c1=80,c1w=880,cx1=c1+c1w/2;ctx.textAlign='center';
 ctx.fillStyle=SUBC;ctx.font=`italic 300 42px ${EN}`;ctx.fillText('your palette is',cx1,130);
 const cyp=470,others=ps.map((_,i)=>i).filter(i=>i!==S.main);
 ctx.strokeStyle='rgba(58,53,50,.12)';ctx.setLineDash([2,12]);ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx1,cyp,265,0,7);ctx.stroke();ctx.setLineDash([]);
 others.forEach((i,k)=>{const a=rad(-90+k*360/11);drop(ctx,cx1+Math.cos(a)*265,cyp+Math.sin(a)*265,48,hex(ps[i]),ps[i])});
 drop(ctx,cx1,cyp,125,hex(m),m);
 ctx.fillStyle=SUBC;ctx.font=`400 34px ${EN}`;ctx.fillText(A.code.split('').join('  ·  '),cx1,860);
 ctx.fillStyle=INK;fitFont(ctx,T.n,c1w-40,76,30,600,JP);ctx.fillText(T.n,cx1,960);
 ctx.fillStyle='#857c75';fitFont(ctx,T.c,c1w-40,34,16,400,JP);ctx.fillText(T.c,cx1,1030);
 ctx.font=`400 26px ${JP}`;const kw=T.k.map(k=>ctx.measureText(k).width+56),tw=kw.reduce((a,b)=>a+b,0)+16*(kw.length-1);let kx=cx1-tw/2;
 T.k.forEach((k,i)=>{ctx.fillStyle='rgba(255,255,255,.7)';rrect(ctx,kx,1068,kw[i],50,25);ctx.fill();ctx.fillStyle=INK;ctx.fillText(k,kx+kw[i]/2,1102);kx+=kw[i]+16});
 const bars=[['深い','明るい',pct(A.L)],['くすみ','鮮やか',pct(A.Sa)],['クール','ウォーム',pct(A.W)],['気まぐれ','統一',uP]];
 bars.forEach((b,i)=>{const y=1190+i*70,x0=c1+70,x1=c1+c1w-70;ctx.font=`400 26px ${JP}`;
  ctx.textAlign='left';ctx.fillStyle=b[2]<50?INK:'#b0a8a1';ctx.fillText(b[0]+(b[2]<50?`  ${100-b[2]}%`:''),x0,y);
  ctx.textAlign='right';ctx.fillStyle=b[2]>=50?INK:'#b0a8a1';ctx.fillText((b[2]>=50?`${b[2]}%  `:'')+b[1],x1,y);
  ctx.fillStyle='rgba(58,53,50,.1)';ctx.fillRect(x0,y+20,x1-x0,4);
  const kx2=x0+(x1-x0)*b[2]/100;ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.2)';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(kx2,y+22,13,0,7);ctx.fill();ctx.shadowBlur=0});
 ctx.textAlign='center';ctx.fillStyle=SUBC;ctx.font=`italic 300 34px ${EN}`;ctx.fillText('YOUR PALETTE  —  #YOURPALETTE',cx1,1530);
 /* detail columns */
 const toneSum=A.tones.slice(0,4).map(([t,n])=>`${t} ${n}`).join(' ／ ');
 const tc=ps.find(p=>!p.mono&&toneOf(p)===top);
 const cols=[
  [{t:'h',en:'Portrait',jp:'あなたという色'},{t:'p',x:T.o},{t:'h',en:'Life',jp:'あなたの日々'},{t:'sub',x:'恋愛'},{t:'p',x:T.love},{t:'sub',x:'人間関係'},{t:'p',x:T.ppl},{t:'sub',x:'仕事・学び'},{t:'p',x:T.work}],
  [{t:'h',en:'Favorite',jp:'いちばん好きな色'},{t:'sw',c:m,a:cname(m),b:hex(m)},{t:'p',x:FAM[m.f].n+'をいちばんに選んだあなたは、'+FAVTXT[m.f]},
   {t:'h',en:'Tone',jp:'パーソナルトーン'},{t:'sw',c:tc,a:top+'トーン',b:toneSum},{t:'p',x:TONES[top][1]},
   {t:'h',en:'Season',jp:'パレットの季節'},{t:'sub',x:SE[1]+'　'+SE[0]},{t:'p',x:SE[2]},
   {t:'h',en:'Missing',jp:'あなたに足りない色'},{t:'sw',c:A.comp,a:A.compName,b:hex(A.comp)},{t:'p',x:'いちばん好きな色の反対側にある色。足りない視点やエネルギーを、そっと補ってくれます。'}],
  [{t:'h',en:'Habit',jp:'選び方のくせ'},{t:'sub',x:`${sp[0]}　1色 ${A.speed.toFixed(1)}秒 ／ 初志貫徹率 ${A.kept}%`},{t:'p',x:sp[1]+kp},
   {t:'h',en:'Notes',jp:'強みと弱み'},{t:'sub',x:'強み'},{t:'p',x:T.s},{t:'sub',x:'弱み'},{t:'p',x:T.w},{t:'sub',x:'相性'},{t:'p',x:`「${TYPES[opp].n}」タイプ。正反対の色を持つから、足りない色を補い合える関係。`},
   {t:'h',en:'Colors',jp:'パレットの十二色'},{t:'chips',x:ps}]];
 cols.forEach((B,i)=>{const x=1040+i*670,w=600;ctx.fillStyle='rgba(255,255,255,.55)';rrect(ctx,x-34,70,w+68,H-140,40);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;ctx.stroke();layoutCol(ctx,B,x,w,110,H-120)});
 return cv;
}
/* ---------- share ---------- */
function shareURL(){const u=location.href.split('#')[0];return /^https?:/.test(u)?u:''}
async function shareSNS(txt){
 const url=shareURL();
 if(navigator.share){try{await navigator.share(url?{title:'YOUR PALETTE',text:txt,url}:{title:'YOUR PALETTE',text:txt});return}catch(e){if(e&&e.name==='AbortError')return}}
 sharePanel(txt,url);
}
function sharePanel(txt,url){
 const t=encodeURIComponent(txt),u=encodeURIComponent(url),tu=encodeURIComponent(url?txt+'\n'+url:txt);
 const items=[
  ['LINE','#06C755','L','https://line.me/R/share?text='+tu],
  ['X','#111','𝕏','https://twitter.com/intent/tweet?text='+t+(url?'&url='+u:'')],
  ['Threads','#111','@','https://www.threads.net/intent/post?text='+tu],
  ['Facebook','#1877F2','f','https://www.facebook.com/sharer/sharer.php?u='+(u||encodeURIComponent('https://'))+'&quote='+t],
  ['メール','#8a817a','✉','mailto:?subject='+encodeURIComponent('YOUR PALETTE')+'&body='+tu]];
 const md=document.createElement('div');md.className='modal';
 md.innerHTML=`<h4>SNSで共有する</h4><div class="share">${items.map(i=>`<a href="${i[3]}" target="_blank" rel="noopener"><i style="background:${i[1]}">${i[2]}</i>${i[0]}</a>`).join('')}<button id="cpl"><i style="background:#c9bfb6">⧉</i>コピー</button></div><div class="row"><button class="btn soft" id="cl">閉じる</button></div><p>Instagramには、結果画像を保存して投稿してね</p>`;
 document.body.appendChild(md);
 md.querySelector('#cl').onclick=()=>md.remove();
 md.querySelector('#cpl').onclick=()=>copy(url?txt+'\n'+url:txt,'共有テキストをコピーしました');
}
async function saveImage(){
 const btn=$('#img');btn.style.opacity=.5;btn.textContent='画像をつくっています…';
 const cv=await render();const url=cv.toDataURL('image/png');
 btn.style.opacity=1;btn.textContent='結果を画像で保存';
 const md=document.createElement('div');md.className='modal';
 let file=null;try{const bl=await new Promise(r=>cv.toBlob(r,'image/png'));file=new File([bl],'your-palette.png',{type:'image/png'})}catch(e){}
 const canFile=!!(file&&navigator.canShare&&navigator.canShare({files:[file]}));
 md.innerHTML=`<img src="${url}" alt="診断結果の画像"><div class="row">${DL?'<button class="btn" id="dl">この画像を保存する</button>':''}${canFile?'<button class="btn soft" id="shi">画像をSNSで共有</button>':''}<button class="btn soft" id="cl">閉じる</button></div><p id="mh">${DL?'保存できないときは、画像を長押しして保存してください。':'画像を長押し（右クリック）して保存してください。'}</p>`;
 document.body.appendChild(md);
 md.querySelector('#cl').onclick=()=>md.remove();
 const shi=md.querySelector('#shi');if(shi)shi.onclick=async()=>{try{await navigator.share({files:[file],title:'YOUR PALETTE',text:'#YOURPALETTE'})}catch(e){}};
 const dl=md.querySelector('#dl');
 if(dl)dl.onclick=()=>cv.toBlob(async b=>{try{await DL.save({filename:'your-palette.png',data:b});toast('保存しました')}
  catch(e){if(e&&e.code==='declined')toast('キャンセルしました');else{dl.remove();md.querySelector('#mh').textContent='ここでは保存ボタンが使えないようです。画像を長押しして保存してください。'}}},'image/png');
}
start();
